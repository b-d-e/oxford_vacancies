name: Monitor Oxford College Vacancies

on:
  schedule:
    # Run schedule based on CI variable (default: daily at 8:00 AM UTC)
    - cron: ${{ vars.CRON_SCHEDULE || '0 8 * * *' }}
  workflow_dispatch:  # Allow manual triggering for testing

jobs:
  check-vacancies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyyaml
          
      - name: Check for vacancies with keywords
        id: check_vacancies
        run: |
          python check_vacancies.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VACANCY_KEYWORDS: ${{ vars.VACANCY_KEYWORDS }}
          
      - name: Commit changes to tracked vacancies
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Check if the file exists and if there are changes to commit
          if [ -f "tracked_vacancies.json" ]; then
            git add tracked_vacancies.json
            
            # Only attempt to commit if there are changes
            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "Update tracked vacancies"
              git push
            fi
          else
            echo "tracked_vacancies.json doesn't exist yet, nothing to commit"
          fi